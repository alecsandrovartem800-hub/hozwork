name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - sport-lounge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static files
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://srqmqyldxmbdjxqjevxa.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_645FLyRjM_IbVrzo3fUTsw_iFoVfIay
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/out
          branch: gh-pages
