    name: sport-lounge-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        value: https://srqmqyldxmbdjxqjevxa.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_645FLyRjM_IbVrzo3fUTsw_iFoVfIay
      - key: SUPABASE_SERVICE_KEY
        value: YOUR_SUPABASE_SERVICE_KEY
      - key: TELEGRAM_SUPPORT_BOT_TOKEN
        value: YOUR_TELEGRAM_SUPPORT_BOT_TOKEN
      - key: TELEGRAM_ORDER_BOT_TOKEN
        value: YOUR_TELEGRAM_ORDER_BOT_TOKEN
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: ""
      - key: SERVER_SECRET
        value: YOUR_SERVER_SECRET
